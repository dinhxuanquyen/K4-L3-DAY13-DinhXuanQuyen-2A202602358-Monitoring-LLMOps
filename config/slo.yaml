service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: SLI là tỷ lệ request nhận response thành công trong <= 3000ms trên tổng request trong cửa sổ 28 ngày; error budget là 0.5% request không đạt SLI, không phải downtime budget. Chọn target này làm ngưỡng ban đầu và đánh giá lại bằng workload thực tế.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
