alerts:
  - name: High_Latency_P95
    severity: warning
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: dev_team
    runbook: docs/alerts.md#high-latency
  - name: Elevated_Error_Rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: dev_team
    runbook: docs/alerts.md#elevated-error-rate
  - name: Cost_Spike
    severity: warning
    condition: daily_cost_usd > 2.5
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: dev_team
    runbook: docs/alerts.md#cost-spike
